apply plugin: 'maven-publish'

tasks.register('androidSourcesJar', Jar) {
    archiveClassifier.set('sources')
    from android.sourceSets.main.java.srcDirs
}
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = project.group.toString()
                artifactId = project.ext.artifactId
                version = project.version.toString()
                from components.release
                artifact androidSourcesJar
                pom {
                    name = project.ext.name
                    description = project.ext.description
                    url = 'https://github.com/EndearingAI/facebook-android-sdk'
                    licenses {
                        license {
                            name = 'Facebook Platform License'
                            url = 'https://github.com/facebook/facebook-android-sdk/blob/main/LICENSE.txt'
                            distribution = 'repo'
                        }
                    }
                }
            }
        }
        repositories {
            maven { url = "${rootProject.layout.buildDirectory.get().asFile}/fork-maven" }
        }
    }
}
